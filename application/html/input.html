<!doctype html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bilder Upload</title>
	<style>
		:root {
			color-scheme: light;
			font-family: "Segoe UI", sans-serif;
			background: #f3f5f4;
			color: #172523;
		}
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
		}
		main {
			width: min(100%, 420px);
			padding: 32px;
			background: #fff;
			border: 1px solid #dce4e1;
			border-radius: 8px;
			box-shadow: 0 12px 32px rgb(23 37 35 / 7%);
		}
		h1 { margin: 0 0 28px; font-size: 28px; }
		label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
		input[type="text"] {
			width: 100%;
			min-height: 48px;
			margin-bottom: 16px;
			padding: 0 12px;
			border: 1px solid #aab9b4;
			border-radius: 5px;
			font: inherit;
		}
		button {
			width: 100%;
			min-height: 50px;
			border: 0;
			border-radius: 5px;
			background: #176b58;
			color: white;
			font: inherit;
			font-weight: 650;
			cursor: pointer;
		}
		button:disabled { cursor: wait; opacity: .65; }
		#status { min-height: 24px; margin: 14px 0 0; font-size: 14px; }
		#status[data-kind="error"] { color: #a12b2b; }
		#status[data-kind="success"] { color: #176b58; }
		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}
		@media (max-width: 480px) {
			body { padding: 16px; }
			main { padding: 24px; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Bilder Upload</h1>
		<form id="upload-form">
			<label for="folder-name">Ordnername</label>
			<input id="folder-name" name="folder_name" type="text" maxlength="80" required autocomplete="off">
			<input id="picture" class="visually-hidden" name="picture" type="file" accept="image/*" capture="environment" required>
			<button id="camera-button" type="button">Foto aufnehmen</button>
			<p id="status" role="status" aria-live="polite"></p>
		</form>
	</main>
	<script>
		const form = document.querySelector('#upload-form');
		const folderNameInput = document.querySelector('#folder-name');
		const pictureInput = document.querySelector('#picture');
		const cameraButton = document.querySelector('#camera-button');
		const status = document.querySelector('#status');

		cameraButton.addEventListener('click', () => {
			if (!folderNameInput.reportValidity()) return;
			pictureInput.click();
		});

		pictureInput.addEventListener('change', async () => {
			if (!pictureInput.files.length) return;

			cameraButton.disabled = true;
			cameraButton.textContent = 'Wird hochgeladen ...';
			status.textContent = '';
			status.dataset.kind = '';

			try {
				const response = await fetch('/upload', { method: 'POST', body: new FormData(form) });
				const result = await response.json();
				if (!response.ok) throw new Error(result.error || 'Upload fehlgeschlagen.');
				status.textContent = result.message;
				status.dataset.kind = 'success';
				pictureInput.value = '';
			} catch (error) {
				status.textContent = error.message || 'Upload fehlgeschlagen.';
				status.dataset.kind = 'error';
			} finally {
				cameraButton.disabled = false;
				cameraButton.textContent = 'Foto aufnehmen';
			}
		});
	</script>
</body>
</html>
